# ---------------------------------------------------------------------------
# Continuous integration
#
#   Every push / pull request:  lint + test the API, lint + build the React
#                               frontend, then build both Docker images.
#   Push to main only:          also publish the images to GitHub Container
#                               Registry (ghcr.io), tagged with the commit SHA
#                               and "latest". The Kubernetes project pulls
#                               these images.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run on the same branch when a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the publish job asks for more below.
permissions:
  contents: read

jobs:
  test-api:
    name: Lint & test API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Fail on high/critical vulnerabilities in the packages that ship.
      - run: npm audit --omit=dev --audit-level=high

  # Runs at the same time as test-api (neither needs the other).
  test-web:
    name: Lint & build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      # Proves the React app compiles (a broken import fails here).
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  build-images:
    name: Build ${{ matrix.service }} image
    needs: [test-api, test-web]   # only build images if both checks pass
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Works out image name and tags, e.g.
      #   ghcr.io/<you>/workout-logger-api:sha-1a2b3c4 and :latest
      # (it also lowercases the owner name, which ghcr.io requires).
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/workout-logger-${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers from previous runs to speed up builds.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
