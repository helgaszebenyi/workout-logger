# Continuous integration: GitHub runs this on every push and pull request.
#
#   1. Check the API: install, lint, test, security audit.
#   2. Build both Docker images (only if step 1 passed).
#      On pushes to main, also publish them to GitHub Container Registry
#      (ghcr.io), tagged with the commit and "latest".
name: CI

on:
  push:
    branches: [main]
  pull_request:

# If a newer commit arrives on the same branch, cancel the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs can only read the code unless they ask for more.
permissions:
  contents: read

jobs:
  api:
    name: Lint, test and audit the API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Fails only for high or critical issues in what ships to production;
      # moderate issues in dev tools don't block the build.
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

  images:
    name: Build the ${{ matrix.service }} image
    needs: api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # allowed to publish to ghcr.io
    strategy:
      matrix:
        service: [api, web]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # Image names must be lowercase, but GitHub usernames don't have to be.
      - name: Work out the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/workout-logger-${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: sha-<commit> (always) and latest (on main).
      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and publish on main)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers from earlier runs, so builds after the first are fast.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}