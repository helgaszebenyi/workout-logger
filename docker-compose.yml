# Runs the whole app with one command, the same way it runs in Kubernetes:
# an API container and a frontend container, with nginx in front.
#
#   cp .env.example .env        # fill in your Firebase web config
#   docker compose up --build
#   open http://localhost:8080
services:
  api:
    # Build the image from api/Dockerfile.
    build: ./api
    environment:
      PORT: 8080
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/service-account.json
    volumes:
      # The key is mounted when the container starts, never built into the image.
      # In Kubernetes this becomes a Secret, mounted the same way.
      - ./secrets:/secrets:ro
    # No "ports": the API can't be reached from outside, only by the web
    # container through nginx, just like in production.
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "8080:8080"
    environment:
      # Containers in one compose file reach each other by service name.
      API_UPSTREAM: http://api:8080
      # Read from the .env file next to this one. ":?" stops with a clear
      # message if a value is missing.
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:?Set FIREBASE_API_KEY in .env}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:?Set FIREBASE_AUTH_DOMAIN in .env}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID in .env}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:?Set FIREBASE_APP_ID in .env}
    depends_on:
      api:
        # Start nginx only once the API's health check passes.
        condition: service_healthy
    restart: unless-stopped